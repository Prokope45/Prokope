# Stage 2 of 4 -- Build
#
# Compiles the frontend and bundles the backend into deployable artifacts.
# Runs only after the pre-flight gate passes, so nothing is compiled from code
# that already failed linting, static analysis or type checking.

steps:
  # Emits frontend/dist/, which is picked up by collectstatic in the next step:
  # backend/prokope/settings.py lists frontend/dist in STATICFILES_DIRS.
  build-frontend:
    image: node:20-alpine
    commands:
      - cd frontend
      - npm ci
      - npm run build

  build-backend:
    # Astral's official images bundle uv + the matching Python version
    # preinstalled -- replaces astral-sh/setup-uv entirely, no separate
    # install step needed.
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    environment:
      DJANGO_SETTINGS_MODULE: prokope.settings
      # Pinned so the build is reproducible and hermetic. S3/media storage is
      # only engaged for QA/Heroku, so this keeps collectstatic on the local
      # filesystem instead of reaching for AWS.
      ENVIRONMENT: development
      SECRET_KEY:
        from_secret: secret_key
    commands:
      - cd backend
      - apt-get update && apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config build-essential
      - uv sync --locked
      # Fails fast on misconfiguration that would otherwise only surface at runtime.
      - uv run python manage.py check --deploy
      - uv run python manage.py collectstatic --noinput

when:
  - event: [push, pull_request]
    branch: [develop, main]

depends_on:
  - preflight
