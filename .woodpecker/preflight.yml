# Stage 1 of 4 -- Pre-flight
#
# Linting, static analysis and type checking. Nothing is built or deployed
# here; this gate only rejects code that is malformed, unsafe or mistyped.
#
# Not matrixed on purpose: linting and type checking do not depend on the
# interpreter version, so running them once keeps the gate fast.
# The Python version is pinned to the one in .python-version.

steps:
  # MARK:- Frontend
  # ESLint is both the linter and the static analyser for the TypeScript
  # sources, so a single pass covers both roles.
  lint-frontend:
    image: node:20-alpine
    commands:
      - cd frontend
      - npm ci
      - npm run lint

  typecheck-frontend:
    image: node:20-alpine
    commands:
      - cd frontend
      - npm ci
      - npm run typecheck

  # MARK:- Backend
  lint-backend:
    # Astral's official images bundle uv + the matching Python version
    # preinstalled -- replaces astral-sh/setup-uv entirely, no separate
    # install step needed.
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    environment:
      DJANGO_SETTINGS_MODULE: prokope.settings
      ENVIRONMENT: development
    commands:
      - cd backend
      - uv sync --locked --group dev
      - uv run ruff check .

  analyze-backend:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    environment:
      DJANGO_SETTINGS_MODULE: prokope.settings
      ENVIRONMENT: development
    commands:
      - cd backend
      - uv sync --locked --group dev
      # Security-focused static analysis (B-series rules).
      - uv run bandit -c ../pyproject.toml -r .

  typecheck-backend:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    environment:
      DJANGO_SETTINGS_MODULE: prokope.settings
      ENVIRONMENT: development
    commands:
      - cd backend
      - uv sync --locked --group dev
      - uv run mypy .

when:
  - event: [pull_request]
    branch: [develop]
  - event: [push]
    branch: [main]
