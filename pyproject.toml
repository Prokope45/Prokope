[project]
name = "django-project"
version = "0.1.0"
description = "Django web application"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.8.1",
    "attrs==26.1.0",
    "bleach==4.1.0",
    "boltons==26.0.0",
    "boto3==1.38.41",
    "botocore==1.38.46",
    "certifi==2021.10.8",
    "cffi==2.0.0",
    "charset-normalizer==2.0.10",
    "colorama==0.4.4",
    "cryptography==49.0.0",
    "dj-database-url==2.3.0",
    "Django==5.2",
    "django-admin-interface==0.28.9",
    "django-filter==25.2",
    "djangorestframework==3.17.1",
    "django-colorfield==0.11.0",
    "django-crispy-forms==1.13.0",
    "django-hCaptcha==0.1.0",
    "django-jsonform==2.23.2",
    "django-otp==1.1.3",
    "django-photologue==3.17",
    "django-sortedm2m==4.0.0",
    "drf-spectacular==0.29.0",
    "django-storages==1.14.6",
    "django-summernote==0.8.20.0",
    "django-taggit==6.1.0",
    "ExifRead==3.0.0",
    "face==26.0.1",
    "gitdb==4.0.9",
    "GitPython==3.1.26",
    "glom==25.12.0",
    "gunicorn==23.0.0",
    "idna==3.3",
    "inflection==0.5.1",
    "jmespath==1.1.0",
    "mozilla-django-oidc==5.0.2",
    "mozilla-django-oidc-db==2.0.1",
    "mysqlclient==2.1.0",
    "packaging==26.2",
    "pillow==10.4.0",
    "psycopg2-binary==2.9.10",
    "pycparser==3.0",
    "Pygments==2.20.0",
    "PyJWT==2.13.0",
    "pyparsing==3.0.6",
    "python-dateutil==2.9.0.post0",
    "python-decouple==3.5",
    "python-dotenv==0.19.2",
    "python-slugify==8.0.4",
    "pytz==2025.2",
    "PyYAML==6.0.2",
    "qrcode==7.3.1",
    "requests==2.27.1",
    "s3transfer==0.13.1",
    "six==1.16.0",
    "smmap==5.0.0",
    "sqlparse==0.4.2",
    "text-unidecode==1.3",
    "typing_extensions==4.13.2",
    "tzdata==2021.5",
    "uritemplate==4.1.1",
    "urllib3==1.26.7",
    "webencodings==0.5.1",
    "wheel==0.44.0",
    "whitenoise==6.9.0",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "bandit==1.8.6",
    "coverage==7.8.1",
    "iniconfig==2.3.0",
    "mypy==1.18.2",
    "pluggy==1.6.0",
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "ruff==0.14.4",
    "types-requests==2.31.0.6",
]

[tool.uv]
# Ensures the project's own package isn't required to be installed/buildable
package = false

[tool.ruff]
target-version = "py312"
# Generated/vendored trees that are not ours to lint.
extend-exclude = [
    "backend/staticfiles",
    "backend/media",
    "backend/static",
    "frontend",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "RUF", # ruff-specific
]
ignore = [
    # Line length is handled by the formatter, not the linter.
    "E501",
    # Django models legitimately use non-nullable fields with defaults/blank.
    "DJ001",
    # Inner-class ordering is a style preference, not a correctness issue.
    "DJ012",
    # List concatenation in urlpatterns is idiomatic Django.
    "RUF005",
    # ClassVar annotations on Django models are not yet used in this codebase.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Test modules are allowed to be a little looser.
"**/tests/**" = ["E402", "F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
# Settings are declarative configuration, not typed application code.
exclude = ['(^|/)(\.venv|node_modules|staticfiles|media)(/|$)', '(^|/)prokope/settings\.py$']
# Without the django-stubs plugin, ORM field descriptors and DRF class
# attributes cannot be resolved, producing unavoidable false positives.
# Re-enable these once django-stubs is adopted.
disable_error_code = ["var-annotated", "has-type"]

[[tool.mypy.overrides]]
# Matches the ruff `noqa: F821` on the same dead-code view.
module = "apps.blog.views"
disable_error_code = ["name-defined"]

[tool.bandit]
# Scan first-party application code only. Test suites legitimately contain
# hardcoded fixture passwords, which would otherwise be constant false positives.
# NOTE: bandit matches these globs against each *file* path, so directory
# patterns must end with "/*" to take effect.
exclude_dirs = [
    "./.venv",
    "./frontend",
    "./backend/static",
    "./backend/staticfiles",
    "./backend/media",
    "*/tests/*",
    "*/migrations/*",
]
# B101: assert_used - assertions are the test suite's core mechanism.
skips = ["B101"]
